[project]
name = "household-services"
version = "0.2.0"
description = "Household Services marketplace — FastAPI + SQLAlchemy 2 + Celery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # FastAPI stack
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    # Auth
    "bcrypt>=4.1.2",
    "pyjwt>=2.10.0",
    # DB
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    # Background jobs
    "celery>=5.4.0",
    "redis>=5.2.1",
    # Rate limiting
    "slowapi>=0.1.9",
    # Excel/CSV exports
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Email
    "jinja2>=3.1.5",
    # Gemini via google-genai
    "google-genai>=0.3.0",
    # Symmetric encryption for per-user BYOK Gemini key (Fernet)
    "cryptography>=44.0.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
