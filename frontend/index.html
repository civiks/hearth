<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand-mark.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.dicebear.com" />
    <title>hearth</title>
    <script>
      // Apply theme before paint so dark mode doesn't flash on load.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var effective =
            stored === "dark" ? "dark"
            : stored === "system" ? (prefersDark ? "dark" : "light")
            : "light";
          if (effective === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = effective;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          if (!regs.length) return;
          Promise.all(regs.map((r) => r.unregister())).then(() =>
            caches?.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))),
          );
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
